name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HomeInventory.sln

      - name: Build
        run: dotnet build HomeInventory.sln --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test HomeInventory.Tests --no-build --configuration Release --logger "console;verbosity=normal"
